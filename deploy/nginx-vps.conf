# ==============================================================================
# Nginx Host Configuration for VPS Production
# Path on VPS: /etc/nginx/sites-available/doccontrol.yourdomain.com.conf
#
# Activation Commands:
# 1. sudo ln -s /etc/nginx/sites-available/doccontrol.yourdomain.com.conf /etc/nginx/sites-enabled/
# 2. sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d doccontrol.yourdomain.com
# ==============================================================================

# HTTP -> Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doccontrol.yourdomain.com; # Ganti dengan domain/subdomain Anda

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Production)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doccontrol.yourdomain.com; # Ganti dengan domain/subdomain Anda

    # SSL Certificates (Di-generate otomatis oleh Certbot)
    ssl_certificate /etc/letsencrypt/live/doccontrol.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doccontrol.yourdomain.com/privkey.pem;

    # SSL Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Document upload limit (ISO standard PDF/DOCX)
    client_max_body_size 50M;

    # 1. Frontend Web App (Proxy to Docker container on 127.0.0.1:3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. Backend API Endpoint (Proxy to Docker container on 127.0.0.1:5005)
    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 3. Static Document Uploads (Served direct from NVMe SSD)
    location /uploads/ {
        alias /var/www/document-control/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 4. Health Check
    location /health {
        proxy_pass http://127.0.0.1:5005/health;
        proxy_http_version 1.1;
    }
}
